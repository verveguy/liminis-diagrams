# Deploy the demo/ app to GitHub Pages.
#
# Triggers on push to main, not on release like verveguy/liminis-editor's
# equivalent workflow. That's deliberate, not an oversight: demo/ consumes
# @liminis/diagrams from the npm registry rather than from ../src (see
# demo/package.json), which makes it a continuous consumer-integration test
# of the published package, not just a showcase. Deploying only on release
# would mean a broken publish (wrong `files`, a stale `exports` map, a
# missing entry point) could sit undetected until the next release cut.
# Triggering on every push to main surfaces that immediately. A failed
# deploy leaves the previously-published Pages content live rather than
# tearing it down, so this can't blank the site — it only fails CI until
# fixed.
#
# Also builds (but does not deploy) on pull_request, so a broken demo is
# caught in review rather than only after merge.
name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: demo/pnpm-lock.yaml

      # Builds the demo and copies it to docs/public/demo, which Astro then
      # copies into its own output — so the demo ships as part of the docs
      # site rather than being assembled afterwards.
      #
      # This is the same command a developer runs, deliberately. The staged
      # copy is gitignored, so a fresh checkout running `pnpm dev` served a 404
      # for the /demo/ link on the docs homepage; `pnpm --dir docs demo` before
      # `pnpm dev` now gives the deployed shape. A CI-only assembly step would
      # have kept that divergence invisible until production.
      #
      # demo/ is its own package, deliberately not a workspace member of the
      # repo root — no pnpm-workspace.yaml exists here, which is what keeps its
      # @liminis/diagrams dependency resolving from the registry instead of
      # symlinking to ../src. The script installs and builds from inside demo/,
      # never from the root.
      - name: Stage the demo inside the docs site
        run: pnpm --dir docs demo

      # docs/ is its own package, for the same reason demo/ is: keeping the
      # Astro/Starlight toolchain out of the published package's dev install,
      # which CI runs for lint, typecheck and test on every pull request.
      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      # Fails if a committed SVG no longer matches the ```c4 fence it was
      # rendered from. Those images are what GitHub shows -- github.com has no
      # build step -- so a stale one is a wrong picture in the documentation,
      # which is worse than no picture. Same guarantee fabrik gets from its
      # docs-drift workflow.
      - name: Check the rendered diagrams are current
        working-directory: docs
        run: pnpm diagrams:check

      - name: Build docs
        working-directory: docs
        run: pnpm build

      # Asserted rather than assumed: a base path disagreeing with where Pages
      # serves it 404s every asset while the HTML still loads, which reads as a
      # broken app rather than a broken deploy.
      - name: Check the assembled layout
        run: |
          set -euo pipefail
          test -f docs/dist/index.html      || { echo "docs index missing"; exit 1; }
          test -f docs/dist/demo/index.html || { echo "demo index missing"; exit 1; }
          grep -q '/liminis-diagrams/demo/assets/' docs/dist/demo/index.html \
            || { echo "demo asset paths are not under /liminis-diagrams/demo/"; exit 1; }
          grep -q '/liminis-diagrams/_astro/' docs/dist/index.html \
            || { echo "docs asset paths are not under /liminis-diagrams/"; exit 1; }

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
