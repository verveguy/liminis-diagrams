name: CI

# This repository stands on its own. Nothing here checks out, fetches, or
# authenticates against another repository — that independence is the point of
# the extraction, and it is cheap to lose by accident. Deliberately no
# reference to the repository this package came from appears in this file at
# all, not even in a comment, so that "does CI reach outward?" stays a
# one-line grep. The extraction itself is recorded in docs/EXTRACTION-PLAN.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Note the gap with `engines.node` in package.json, which says `>=22`:
      # this job runs 24 only. 22 is claimed because it is Active LTS and
      # nothing in the dependency graph needs more, but it is supported by
      # intent rather than by test. Closing that gap means matrixing this job
      # over [22, 24] — worth doing if a consumer reports actually running 22,
      # and not worth the CI minutes before then.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
